<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>waty 示例</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #1a73e8; }
        button { margin: 0.25rem; padding: 0.4rem 0.8rem; cursor: pointer; }
        pre { background: #f5f5f5; padding: 1rem; border-radius: 6px; overflow: auto; }
        #out { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🚀 waty 阶段 2 示例</h1>
    <p>此页面由 waty_embed_resources 嵌入到可执行文件。</p>

    <div>
        <button id="ipc">ipc.invoke("greet", "waty")</button>
        <button id="os">os.platform / os.homedir / getPath</button>
        <button id="fs">fs.stat(index.html)</button>
        <button id="win">window.getSize</button>
        <button id="sqlite3">sqlite3 基本用例</button>
        <button id="emit">等待 C++ emit("server-ping")</button>
    </div>

    <h3>输出</h3>
    <pre><code id="out"></code></pre>

    <script>
        const out = (s) => { document.getElementById("out").textContent += s + "\n"; };

        document.getElementById("ipc").onclick = async () => {
            const r = await window.waty.ipc.invoke("greet", "waty");
            out("ipc: " + JSON.stringify(r));
        };

        document.getElementById("os").onclick = async () => {
            const platform = await window.waty.os.platform();
            const homedir = await window.waty.os.homedir();
            const userData = await window.waty.os.getPath("userData");
            out(`platform=${platform} homedir=${homedir} userData=${userData}`);
        };

        document.getElementById("fs").onclick = async () => {
            const stats = await window.waty.fs.stat("index.html");
            out("fs.stat: " + JSON.stringify(stats));
        };

        document.getElementById("win").onclick = async () => {
            const size = await window.waty.window.getSize();
            out("window.getSize: " + JSON.stringify(size));
        };

        document.getElementById("sqlite3").onclick = async () => {
            if (!window.waty.sqlite3) {
                out("sqlite3 未启用（permissions.sqlite3 = false）");
                return;
            }
            try {
                const db = await window.waty.sqlite3.openDatabase("demo", "0.0.1");
                out("openDatabase: " + db.dbId);
                await db.execute("CREATE TABLE IF NOT EXISTS t(id INTEGER PRIMARY KEY, name TEXT)");
                const inserted = await db.execute("INSERT INTO t(name) VALUES (:name)", { name: "hello" });
                out("execute: " + JSON.stringify(inserted));
                const result = await db.query("SELECT id, name FROM t ORDER BY id");
                out("query: " + JSON.stringify(result));
                await db.transaction([
                    { sql: "INSERT INTO t(name) VALUES (:name)", params: { name: "a" } },
                    { sql: "INSERT INTO t(name) VALUES (:name)", params: { name: "b" } }
                ]);
                out("transaction: ok");
                await db.close();
                out("close: ok");
            } catch (e) {
                out("sqlite3 错误: " + JSON.stringify(e));
            }
        };

        document.getElementById("emit").onclick = () => {
            out("等待 C++ emit...");
        };

        if (window.waty.ipc) {
            window.waty.ipc.on("server-ping", (data) => {
                out("收到 C++ 推送: " + JSON.stringify(data));
            });

            // 页面加载后自动调用一次 IPC，验证 JS → C++ 桥
            window.waty.ipc.invoke("greet", "auto-test").then((r) => {
                console.log("IPC 结果: " + JSON.stringify(r));
                out("自动 IPC 结果: " + JSON.stringify(r));
            }).catch((e) => {
                console.error("IPC 错误: " + JSON.stringify(e));
                out("自动 IPC 错误: " + JSON.stringify(e));
            });

            if (window.waty.fs) {
                window.waty.fs.stat("/tmp").then((s) => {
                    console.log("fs.stat /tmp: " + JSON.stringify(s));
                }).catch((e) => {
                    console.error("fs.stat 错误: " + JSON.stringify(e));
                });
            }
        }
    </script>
</body>
</html>
